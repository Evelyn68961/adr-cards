<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADR 通報卡</title>
  <link rel="stylesheet" href="style.css?v=20261030">
</head>
<body>
  <header class="no-print">
    <h1>ADR 通報卡製作</h1>
    <p class="privacy">資料只在這台電腦的瀏覽器中處理，不會上傳。</p>
  </header>

  <main class="no-print">
    <section class="panel folder-panel">
      <span class="step">ADR 資料夾</span>
      <span id="folderStatus" class="folder-status">尚未連結</span>
      <button id="linkBtn" type="button" class="secondary">連結 ADR 資料夾</button>
      <p id="folderUnsupported" class="hint" hidden>此瀏覽器無法直接寫入檔案，請改用 Chrome 或 Edge。</p>
    </section>

    <section id="statusPanel" class="panel" hidden>
      <div class="step-row">
        <span class="step">目前累積（與 Excel 同步）</span>
        <select id="statusMonth" aria-label="月份"></select>
      </div>
      <div class="stats">
        <div class="stat stat-next"><span class="stat-label">下一個識別碼</span><span id="statNext" class="stat-value"></span></div>
        <div class="stat"><span class="stat-label">最新識別碼</span><span id="statLatest" class="stat-value"></span></div>
        <div class="stat"><span class="stat-label">累積案例</span><span id="statCount" class="stat-value"></span></div>
        <div class="stat"><span class="stat-label">尚未製卡</span><span id="statNoCard" class="stat-value"></span></div>
      </div>
      <p id="statusError" class="status-error" hidden></p>
      <details class="status-list" open>
        <summary>本月案例清單</summary>
        <div class="table-wrap">
          <table>
            <thead><tr><th>識別碼</th><th>病歷號</th><th>藥品</th><th>症狀</th><th>得知日期</th><th>卡片</th></tr></thead>
            <tbody id="statusRows"></tbody>
          </table>
        </div>
        <p id="statusEmpty" class="hint" hidden>這個月還沒有案例。</p>
      </details>
    </section>

    <section class="panel">
      <label for="paste" class="step">1. 從 HIS 複製 ADR 清單貼上（含標題列最好）</label>
      <textarea id="paste" spellcheck="false"
        placeholder="病歷號&#9;姓名&#9;藥碼&#9;MDPNAME&#9;ATC&#9;…&#9;最後異動時間"></textarea>
      <div class="controls">
        <label>起始流水號
          <input id="startSeq" type="number" min="1" max="99" value="1">
        </label>
        <span id="idHint" class="hint"></span>
        <button id="clearBtn" type="button" class="secondary">清除</button>
      </div>
      <ul id="messages" class="messages"></ul>
    </section>

    <section class="panel">
      <div class="step-row">
        <span class="step">2. 勾選要列印的卡片（點文字可修改）</span>
        <span class="actions">
          <button id="saveBtn" type="button" disabled title="所有貼上的個案都會存入，不受勾選影響">存入 Excel 與 PNG（全部）</button>
          <button id="pngBtn" type="button" class="secondary" disabled>下載 PNG</button>
          <button id="pdfBtn" type="button" disabled>產生 PDF</button>
        </span>
      </div>
      <div class="controls">
        <button id="selAll" type="button" class="secondary">全選</button>
        <button id="selNone" type="button" class="secondary">全不選</button>
        <span id="selCount" class="hint"></span>
      </div>
      <ul id="saveMessages" class="messages"></ul>
    </section>
  </main>

  <div id="sheet" class="sheet"></div>
  <div id="printArea" class="print-area"></div>

  <script src="lib/xlsx.full.min.js?v=20261030"></script>
  <script src="parse.js?v=20261030"></script>
  <script src="workbook.js?v=20261030"></script>
  <script src="pdf.js?v=20261030"></script>
  <script src="local.js?v=20261030"></script>
  <script src="app.js?v=20261030"></script>
</body>
</html>
